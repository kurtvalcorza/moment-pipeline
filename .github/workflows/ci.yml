name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  HF_HUB_DISABLE_SYMLINKS_WARNING: "1"

jobs:
  # Always-on gate: lint plus the no-network unit suite. Installs from the committed
  # lock, so CI and Colab resolve the identical dependency graph (RFC runtime section).
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.9"
          enable-cache: true
      - name: Install from the lock
        run: uv sync --locked
      - name: Lock parity (uv.lock <-> requirements.lock.txt)
        run: |
          uv export --format requirements-txt --locked --no-dev --no-emit-project \
            -o /tmp/requirements.check.txt
          diff -u requirements.lock.txt /tmp/requirements.check.txt
      - name: Ruff
        run: uv run ruff check .
      - name: Unit tests (no network, no weights)
        run: uv run pytest -m "not integration" -q

  # Real weights on CPU. Kept off pull_request so a fork PR cannot spend the download,
  # and cached by the pinned commit so repeat runs do not re-fetch 454 MB.
  integration:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.9"
          enable-cache: true
      - name: Cache the pinned Hugging Face snapshot
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: hf-AutonLab-MOMENT-1-base-9fea447e740eb968a9e8d80c7562ae122bdb5dde
      - name: Install from the lock
        run: uv sync --locked
      - name: Integration tests (CPU, real model.safetensors)
        run: uv run pytest -m integration -q
