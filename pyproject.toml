[project]
name = "moment-pipeline"
version = "0.1.0"
description = "DIMER pipeline for AutonLab/MOMENT-1-base: embeddings, imputation/reconstruction, and reconstruction-based anomaly scoring."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Kurt Valcorza" }]
keywords = ["time-series", "foundation-model", "moment", "dimer"]
# Runtime dependencies are pinned exactly (DIMER NOTEBOOK_SPEC 1.1 ENV2/PAR2) to the versions
# requirements.lock.txt resolved; a standalone tutorial notebook carries the same pins inline.
# `momentfm` is the exception: it is installed from source at the exact upstream commit named in
# [tool.uv.sources] below (RFC M-7), because no usable PyPI release exists.
dependencies = [
    "momentfm",
    "torch==2.14.0",
    "torchvision==0.29.0",
    "torchaudio==2.11.0",
    "numpy==2.5.3",
    "pandas==3.0.5",
    "huggingface-hub==1.30.0",
    "safetensors==0.8.0",
    "transformers==5.16.1",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6.0"]

# momentfm is NOT installable from PyPI for this project: PyPI's latest is 0.1.4
# (2025-03-19) and hard-pins transformers==4.33.3 / huggingface-hub==0.24.0 /
# numpy==1.25.2, which is unusable with the rest of this runtime. RFC M-7 allows a
# source install provided an exact upstream commit SHA is pinned.
[tool.uv.sources]
momentfm = { git = "https://github.com/moment-timeseries-foundation-model/moment", rev = "38f7310ad594100747ca2a8357e9c7ca7d323e0e" }

[tool.uv]
environments = ["sys_platform == 'linux'", "sys_platform == 'win32'"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moment_pipeline"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs the real pinned MOMENT weights and network access (CPU is sufficient)",
]
